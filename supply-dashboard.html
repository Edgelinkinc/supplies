<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edgelink — Supply Order Center (HQ)</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap');
:root{
  --magenta:#E20074;--magenta-dk:#b3005b;--magenta-lt:#fce8f3;
  --purple:#5C2D91;--purple-dk:#3e1d6e;--purple-lt:#ede7f6;
  --ink:#241229;--muted:#6b6470;--line:#ece7f1;--bg:#f6f3fa;--card:#fff;--surface:#faf8fc;
  --green:#1f9d5b;--green-bg:#e7f6ed;--amber:#c77d12;--amber-bg:#fcf2df;
  --blue:#2563c9;--blue-bg:#e8f0fd;--red:#cf2f4a;--red-bg:#fbe9ec;--gray:#7a7484;--gray-bg:#f0edf4;
  --r:14px;--r-sm:10px;--shadow:0 1px 2px rgba(36,18,41,.05),0 4px 16px rgba(74,27,92,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Montserrat',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:50px}
h1,h2,h3,h4{font-weight:600;line-height:1.2}
.topbar{background:linear-gradient(95deg,var(--purple),var(--magenta));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(74,27,92,.18)}
.diamond{width:30px;height:30px;transform:rotate(45deg);border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.diamond span{transform:rotate(-45deg);font-family:'Bebas Neue';font-size:20px;color:var(--magenta)}
.brand .name{font-family:'Bebas Neue';font-size:26px;letter-spacing:1px;line-height:1}
.brand .sub{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;opacity:.85;margin-top:-2px}
.livebadge{margin-left:auto;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600}
.livebadge .d{width:8px;height:8px;border-radius:50%;background:#7CFFB2}
.livebadge.err .d{background:#FFB0B0}
.refresh{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Montserrat'}
.refresh:hover{background:rgba(255,255,255,.26)}
.wrap{max-width:1160px;margin:0 auto;padding:22px 18px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-bottom:18px;box-shadow:var(--shadow)}
.tabs button{font-family:'Montserrat';font-weight:500;font-size:13px;color:var(--muted);background:transparent;border:0;padding:9px 14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
.tabs button:hover{background:var(--surface);color:var(--ink)}
.tabs button.on{background:linear-gradient(95deg,var(--purple),var(--magenta));color:#fff}
.tabs button i{font-style:normal}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.section-title{font-family:'Bebas Neue';font-size:24px;letter-spacing:.6px;color:var(--purple);margin-bottom:3px}
.section-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--magenta)}
.tile.p:before{background:var(--purple)}.tile.a:before{background:var(--amber)}.tile.g:before{background:var(--green)}.tile.b:before{background:var(--blue)}.tile.r:before{background:var(--red)}.tile.x:before{background:var(--gray)}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
.tile .val{font-family:'Bebas Neue';font-size:38px;line-height:1;margin-top:7px}
.tile .delta{font-size:11px;color:var(--muted);margin-top:5px}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.b-pending{background:var(--amber-bg);color:var(--amber)}.b-fulfilled{background:var(--green-bg);color:var(--green)}.b-partial{background:var(--blue-bg);color:var(--blue)}.b-transit{background:#efe9fb;color:var(--purple)}.b-canceled{background:var(--red-bg);color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
table.tbl th{text-align:left;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
table.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:var(--surface)}
.ordid{font-weight:600;color:var(--purple)}
.btn{font-family:'Montserrat';font-weight:600;font-size:13px;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn-primary{background:linear-gradient(95deg,var(--purple),var(--magenta));color:#fff}.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:#fff;color:var(--purple);border:1px solid var(--line)}.btn-ghost:hover{background:var(--surface)}
.btn-sm{padding:8px 13px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn i{font-style:normal}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--muted)}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:880px){.split.two{grid-template-columns:1.4fr 1fr}}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters select,.filters input{font-family:'Montserrat';font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.barchart{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:10px;font-size:12.5px}
.barrow .track{height:14px;background:var(--gray-bg);border-radius:8px;overflow:hidden}
.barrow .fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--magenta));border-radius:8px}
.barrow .n{text-align:right;font-weight:600;font-size:12px}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}
.alertcard{display:flex;gap:12px;padding:13px 15px;border-radius:var(--r-sm);align-items:center;margin-bottom:9px}
.alertcard.warn{background:var(--amber-bg)}.alertcard.danger{background:var(--red-bg)}
.alertcard .big{font-family:'Bebas Neue';font-size:30px;line-height:1}
.alertcard.warn .big{color:var(--amber)}.alertcard.danger .big{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;margin:3px}
.adminlist .li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:9px}
.adminlist .li .nm{font-size:13.5px;font-weight:600}.adminlist .li .meta{font-size:11.5px;color:var(--muted)}
.adminlist .li .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.iconbtn{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--purple);cursor:pointer;font-size:14px}.iconbtn:hover{background:var(--surface)}
.toggle{width:42px;height:24px;border-radius:20px;background:var(--green);position:relative;cursor:pointer;flex-shrink:0;border:0}
.toggle.off{background:#cfc9d6}
.toggle:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.toggle.off:after{left:auto;right:2px}
.pin{max-width:380px;margin:50px auto;text-align:center}
.pin .lock{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--magenta));color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
.pin input{letter-spacing:8px;text-align:center;font-size:22px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;outline:none}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font-family:'Montserrat';font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--magenta);box-shadow:0 0 0 3px rgba(226,0,116,.12)}
.modal-bg{display:none;position:fixed;inset:0;z-index:80;background:rgba(36,18,41,.45);align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(36,18,41,.3);overflow:hidden}
.modal-head{background:linear-gradient(95deg,var(--purple),var(--magenta));color:#fff;padding:18px 22px;display:flex;align-items:center;gap:12px}
.modal-head .x{margin-left:auto;background:rgba(255,255,255,.18);border:0;color:#fff;width:32px;height:32px;border-radius:9px;font-size:18px;cursor:pointer}
.modal-body{padding:22px;max-height:64vh;overflow-y:auto}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13px;margin-bottom:18px}
.kv .k{color:var(--muted);font-weight:600}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
/* ---------- AUDIT STYLES ---------- */
.audit-tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px;margin-bottom:16px;width:fit-content}
.audit-tabs button{font-family:'Montserrat';font-weight:600;font-size:12.5px;color:var(--muted);background:transparent;border:0;padding:8px 14px;border-radius:8px;cursor:pointer}
.audit-tabs button.on{background:#fff;color:var(--purple);box-shadow:0 1px 2px rgba(36,18,41,.08)}
.qbox{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:10px;background:#fff;transition:.15s}
.qbox.no{border-color:var(--red);background:#fef6f8}
.qbox.yes{border-color:var(--green);background:#f5fcf8}
.qbox.na{border-color:var(--gray);background:var(--surface)}
.qbox .qtxt{font-size:13.5px;font-weight:600;margin-bottom:10px;line-height:1.35}
.ynbtns{display:flex;gap:6px;flex-wrap:wrap}
.ynbtns button{font-family:'Montserrat';font-weight:600;font-size:12px;padding:7px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:.12s}
.ynbtns button:hover{background:var(--surface)}
.ynbtns button.yes-on{background:var(--green);color:#fff;border-color:var(--green)}
.ynbtns button.no-on{background:var(--red);color:#fff;border-color:var(--red)}
.ynbtns button.na-on{background:var(--gray);color:#fff;border-color:var(--gray)}
.qnote{margin-top:10px;display:none}
.qbox.no .qnote{display:block}
.qnote textarea{width:100%;font-family:'Montserrat';font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;min-height:60px;resize:vertical;outline:none}
.qnote textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(207,47,74,.12)}
.qphoto{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qphoto label{font-size:12px;font-weight:600;color:var(--purple);cursor:pointer;padding:6px 12px;border:1px dashed var(--purple);border-radius:8px;background:#fff;display:inline-flex;align-items:center;gap:6px}
.qphoto label:hover{background:var(--surface)}
.qphoto input[type=file]{display:none}
.qphoto .preview{height:54px;width:54px;border-radius:8px;background:#eee;background-size:cover;background-position:center;border:1px solid var(--line)}
.qphoto .pname{font-size:11.5px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audit-section-hd{font-family:'Bebas Neue';font-size:18px;color:var(--purple);letter-spacing:.5px;margin:16px 0 8px;padding-top:6px;border-top:1px solid var(--line)}
.audit-section-hd:first-of-type{border-top:0;padding-top:0;margin-top:0}
.issue-card{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:10px;background:#fff;display:flex;gap:14px;align-items:flex-start}
.issue-card.open{border-left:4px solid var(--red)}
.issue-card.prog{border-left:4px solid var(--amber)}
.issue-card.fixed{border-left:4px solid var(--green);opacity:.7}
.issue-card .body{flex:1;min-width:0}
.issue-card .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.issue-card .store{font-weight:700;color:var(--purple)}
.issue-card .q{font-size:13.5px;font-weight:600;margin-bottom:4px}
.issue-card .note{font-size:12.5px;color:var(--ink);background:var(--surface);border-radius:7px;padding:8px 11px;margin:6px 0}
.issue-card .meta{font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.issue-card .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0}
.issue-card .thumb{width:60px;height:60px;border-radius:8px;background:var(--surface) center/cover;border:1px solid var(--line);cursor:pointer;flex-shrink:0}
.b-open{background:var(--red-bg);color:var(--red)}
.b-prog{background:var(--amber-bg);color:var(--amber)}
.b-fixed{background:var(--green-bg);color:var(--green)}
.summary-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;margin-right:6px}
</style>
</head>
<body>
<div class="topbar">
  <div class="diamond"><span>E</span></div>
  <div class="brand"><div class="name">EDGELINK</div><div class="sub">Supply Order Center · HQ</div></div>
  <button class="refresh" onclick="loadOrders(true)">&#8635; Refresh</button>
  <div class="livebadge" id="live"><span class="d"></span><span id="live-txt">Loading…</span></div>
</div>
<div class="wrap" id="wrap"><div class="loading">Loading orders…</div></div>
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal-inner"></div></div>

<script>
/* ============================================================
   EDGELINK SUPPLY ORDER CENTER — HQ Dashboard + Admin
   ES5 only. Reads config from data.json, orders from the
   "Get Edgelink Supply Orders" Power Automate flow.
   ============================================================ */

/* ---------- CONFIG: paste your values here ---------- */
var CONFIG = {
  DATA_URL: "data.json",
  GET_ORDERS_FLOW_URL:    "https://defaultebc8d7eeee3a4821b739b0b060e735.7f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/0178fdd3097948df9458fb2dec501fea/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=t4y6rsJRMVA6VmZCXTkWA_TcqwJd10kX1iw6czTwz50",
  UPDATE_ORDER_FLOW_URL:  "https://defaultebc8d7eeee3a4821b739b0b060e735.7f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c9226483c2ee4341a01a53253b8e76bf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=6rLv3ozqUSEe-CH43x1VHpoGB5KJvVtbJ-K_XqaURv4",
  PUBLISH_CONFIG_FLOW_URL:"https://defaultebc8d7eeee3a4821b739b0b060e735.7f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/085f9689cfee4696817479bfbd6ea377/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=F5fFQBZH_IpwuSmGnxLx3UBSROEYJ3OQfgb7rW82MMg",
  /* ---- AUDIT flows (paste after creating them in Power Automate) ---- */
  SAVE_AUDIT_FLOW_URL:        "PASTE_SAVE_AUDIT_FLOW_URL",        /* Power Automate: create audit log + N issue rows + attach photos */
  GET_AUDIT_ISSUES_FLOW_URL:  "PASTE_GET_AUDIT_ISSUES_FLOW_URL",  /* Power Automate: Get items from Edgelink Audit Issues */
  UPDATE_AUDIT_ISSUE_FLOW_URL:"PASTE_UPDATE_AUDIT_ISSUE_FLOW_URL",/* Power Automate: Update item on Edgelink Audit Issues */
  GET_AUDIT_LOGS_FLOW_URL:    "PASTE_GET_AUDIT_LOGS_FLOW_URL",    /* Power Automate: Get items from Edgelink Audit Logs */
  /* ---- misc ---- */
  EMAILJS_PUBLIC_KEY: "YOUR_EMAILJS_PUBLIC_KEY",                 /* optional: status-change emails */
  EMAILJS_SERVICE_ID: "YOUR_EMAILJS_SERVICE_ID",
  EMAILJS_STATUS_TEMPLATE_ID: "",                               /* optional */
  ADMIN_PIN: "1234",                                            /* CHANGE ME -- and the audit form uses this same PIN */
  GITHUB: { owner:"edgelinkinc", repo:"supplies", branch:"main", path:"data.json" }
};
/* --------------------------------------------------- */

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function X(s){ if(s==null) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function pad2(n){ return n<10?"0"+n:""+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function fmtDate(s){ if(!s) return "—"; s=String(s).substring(0,10); var p=s.split("-"); if(p.length<3) return s; return p[1]+"/"+p[2]+"/"+p[0]; }
function daysSince(s){ if(!s) return 9999; var t=new Date(todayISO()); var x=new Date(String(s).substring(0,10)); return Math.round((t-x)/86400000); }
function uid(p){ return p+Math.random().toString(36).substring(2,7); }
function configured(v){ return v && v.indexOf("PASTE_")<0 && v.indexOf("YOUR_")<0; }

var STATUSES=["Pending","Partially Fulfilled","Fulfilled","In Transit","Canceled"];
function badgeClass(s){ if(s==="Pending")return"b-pending";if(s==="Fulfilled")return"b-fulfilled";if(s==="Partially Fulfilled")return"b-partial";if(s==="In Transit")return"b-transit";if(s==="Canceled")return"b-canceled";return"b-pending"; }
function statusBadge(s){ return '<span class="badge '+badgeClass(s)+'"><span class="dot"></span>'+X(s)+'</span>'; }

/* ---------- state ---------- */
var CFG={categories:[],items:[],stores:[],announcements:[],users:[]};
var ORDERS=[];
function catName(id){ for(var i=0;i<CFG.categories.length;i++){ if(CFG.categories[i].id===id) return CFG.categories[i].name; } return id; }
function itemById(id){ for(var i=0;i<CFG.items.length;i++){ if(CFG.items[i].id===id) return CFG.items[i]; } return null; }
function storeName(c){ for(var i=0;i<CFG.stores.length;i++){ if(CFG.stores[i].code===c) return CFG.stores[i].name; } return c; }
function orderById(id){ for(var i=0;i<ORDERS.length;i++){ if(ORDERS[i].orderId===id) return ORDERS[i]; } return null; }
function orderUnits(o){ var n=0,it=o.items||[]; for(var i=0;i<it.length;i++) n+=(it[i].qty||0); return n; }

/* ---------- sample fallback (so the dashboard works before wiring) ---------- */
var SAMPLE_ORDERS=[
  {orderId:"SO-20260525-4821",employee:"Maria Santos",store:"RI-02",orderDate:"2026-05-25",status:"Pending",po:"",tracking:"",notes:"Need receipt paper ASAP.",updatedBy:"",items:[{id:"op1",name:"Receipt Paper Rolls",cat:"ops",qty:6},{id:"of3",name:"Copy Paper",cat:"office",qty:2},{id:"cl3",name:"Paper Towels",cat:"clean",qty:4}]},

function loadConfig(cb){
  fetch(CONFIG.DATA_URL,{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){ CFG={categories:j.categories||[],items:j.items||[],stores:j.stores||[],announcements:j.announcements||[],users:j.users||[]}; lsSet("supplyCFG",CFG); if(cb)cb(); })
    .catch(function(){ var c=lsGet("supplyCFG",null); if(c) CFG=c; if(cb)cb(); });
}

/* ---------- load orders ---------- */
function normalizeOrder(o){
  var get=function(){ for(var i=0;i<arguments.length;i++){ if(o[arguments[i]]!=null && o[arguments[i]]!=="") return o[arguments[i]]; } return ""; };
  var items=get("items","Items","itemsJson");
  if(typeof items==="string"){
    var s=items.replace(/<[^>]*>/g,"").replace(/&quot;/g,'"').replace(/&#34;/g,'"').replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&#160;/g," ").replace(/&nbsp;/g," ").replace(/&#39;/g,"'").trim();
    try{ items=JSON.parse(s); }catch(e){ items=[]; }
  }
  if(!items || !(items instanceof Array)) items=[];
  return {
    orderId:get("orderId","OrderId","Title","Order_x0020_ID")||uid("SO-"),
    employee:get("employee","Employee"),
    store:get("store","Store","StoreCode"),
    orderDate:String(get("orderDate","OrderDate","Created")||"").substring(0,10),
    status:get("status","Status")||"Pending",
    po:get("po","PO","PONumber"),
    tracking:get("tracking","Tracking","TrackingNumber"),
    cost:get("cost","Cost"),
    notes:get("notes","Notes"),
    fulfillmentNotes:get("fulfillmentNotes","FulfillmentNotes"),
    dateFulfilled:String(get("dateFulfilled","DateFulfilled")||"").substring(0,10),
    updatedBy:get("updatedBy","UpdatedBy"),
    items:items
  };
}
function loadOrders(showSpin){
  setLive("loading","Loading…");
  if(!configured(CONFIG.GET_ORDERS_FLOW_URL)){
    ORDERS=lsGet("supplyOrders",null)||SAMPLE_ORDERS.slice();
    setLive("sample","Sample data — wire the Get flow");
    renderDash(DASH.section); return;
  }
  fetch(CONFIG.GET_ORDERS_FLOW_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(data){
      var arr = data.value || data.orders || data || [];
      if(!(arr instanceof Array)) arr=[];
      ORDERS=[]; for(var i=0;i<arr.length;i++) ORDERS.push(normalizeOrder(arr[i]));
      ORDERS.sort(function(a,b){ return a.orderDate<b.orderDate?1:-1; });
      lsSet("supplyOrders",ORDERS);
      setLive("ok","Live — "+ORDERS.length+" orders");
      renderDash(DASH.section);
    })
    .catch(function(){
      ORDERS=lsGet("supplyOrders",null)||SAMPLE_ORDERS.slice();
      setLive("err","Sync error — showing cached");
      renderDash(DASH.section);
    });
}

function filteredOrders(){

    if(DASH.fStatus && o.status!==DASH.fStatus) continue;
    if(DASH.fFrom && o.orderDate<DASH.fFrom) continue;
    if(DASH.fTo && o.orderDate>DASH.fTo) continue;
    if(DASH.q){ var s=(o.orderId+" "+o.employee).toLowerCase(); if(s.indexOf(DASH.q.toLowerCase())<0) continue; }

  }

function dItems(){

function bars(obj,labelFn){
  var max=1,h=""; for(var k in obj){ if(obj[k]>max) max=obj[k]; }

  return h;
}

    for(var j=0;j<it.length;j++) itxt.push((it[j].qty||0)+"x "+(it[j].name||it[j].id));

  }
  var csv=rows.map(function(r){ return r.map(function(c){ c=String(c==null?"":c); return '"'+c.replace(/"/g,'""')+'"'; }).join(","); }).join("\n");
  download("edgelink-supply-orders-"+todayISO()+".csv",csv,"text/csv");
}
function download(name,text,mime){

}

/* ---------- publish ---------- */
function buildJSON(){
  var out={ _comment:"Edgelink Supply Order Center config.", version:(lsGet("supplyCFG",{}).version||1)+1, updated:todayISO(),
    categories:CFG.categories, items:CFG.items, stores:CFG.stores, announcements:CFG.announcements, users:CFG.users };
  return JSON.stringify(out,null,2);
}
function publishConfig(){
  var json=buildJSON();
  if(configured(CONFIG.PUBLISH_CONFIG_FLOW_URL)){
    fetch(CONFIG.PUBLISH_CONFIG_FLOW_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:CONFIG.GITHUB.path,content:json,branch:CONFIG.GITHUB.branch})})
      .then(function(r){ if(!r.ok) throw 0; ADMIN.dirty=false; alert("Published. The order form will pick it up on next load."); renderAdmin(); })
      .catch(function(){ alert("Publish flow failed. Use Download / Copy and commit data.json to GitHub manually."); downloadConfig(); });
  } else {
    alert("No publish flow configured yet — downloading data.json so you can commit it to GitHub.");
    downloadConfig(); ADMIN.dirty=false; renderAdmin();
  }
}
function downloadConfig(){ download("data.json",buildJSON(),"application/json"); }
function copyConfig(){
  var json=buildJSON();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(json).then(function(){ alert("data.json copied. Paste it into GitHub."); }); }
  else { var t=document.createElement("textarea"); t.value=json; document.body.appendChild(t); t.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(t); alert("data.json copied."); }
}

var ISSUE_FILTER = { store:"", status:"" };

function totalAnsweredQuestions(){ var n=0; for(var i=0;i<AUDIT_QUESTIONS.length;i++){ for(var j=0;j<AUDIT_QUESTIONS[i].items.length;j++){ if(AUDIT_QUESTIONS[i].items[j].type!=="text") n++; } } return n; }
function issueBadge(s){ var cls=s==="Open"?"b-open":s==="In Progress"?"b-prog":"b-fixed"; return '<span class="badge '+cls+'"><span class="dot"></span>'+X(s)+'</span>'; }

function normalizeIssue(o){
  var g=function(){ for(var i=0;i<arguments.length;i++){ if(o[arguments[i]]!=null && o[arguments[i]]!=="") return o[arguments[i]]; } return ""; };
  return { issueId:g("issueId","IssueId","Title")||uid("IS-"), auditId:g("auditId","AuditId"), store:g("store","Store"), auditor:g("auditor","Auditor"), auditDate:String(g("auditDate","AuditDate","Created")||"").substring(0,10), section:g("section","Section"), question:g("question","Question"), note:g("note","Note"), photoUrl:g("photoUrl","PhotoUrl"), status:g("status","Status")||"Open", fixedDate:String(g("fixedDate","FixedDate")||"").substring(0,10), fixedBy:g("fixedBy","FixedBy") };
}
function normalizeLog(o){
  var g=function(){ for(var i=0;i<arguments.length;i++){ if(o[arguments[i]]!=null && o[arguments[i]]!=="") return o[arguments[i]]; } return ""; };
  var ans=g("answers","Answers"); if(typeof ans==="string"){ try{ ans=JSON.parse(ans.replace(/<[^>]*>/g,"").replace(/&quot;/g,'"').replace(/&amp;/g,"&")); }catch(e){ ans={}; } }
  return { auditId:g("auditId","AuditId","Title")||uid("AU-"), store:g("store","Store"), auditor:g("auditor","Auditor"), auditDate:String(g("auditDate","AuditDate","Created")||"").substring(0,10), totalCount:g("totalCount","TotalCount"), flaggedCount:g("flaggedCount","FlaggedCount"), keyholders:g("keyholders","Keyholders"), answers:ans||{} };
}

function loadIssues(cb){
  if(!configured(CONFIG.GET_AUDIT_ISSUES_FLOW_URL)){ ISSUES=lsGet("auditIssues",null)||[]; if(cb)cb(); return; }
  fetch(CONFIG.GET_AUDIT_ISSUES_FLOW_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ var a=d.value||d.issues||d||[]; if(!(a instanceof Array)) a=[]; ISSUES=[]; for(var i=0;i<a.length;i++) ISSUES.push(normalizeIssue(a[i])); lsSet("auditIssues",ISSUES); if(cb)cb(); })
    .catch(function(){ ISSUES=lsGet("auditIssues",null)||[]; if(cb)cb(); });
}
function loadLogs(cb){
  if(!configured(CONFIG.GET_AUDIT_LOGS_FLOW_URL)){ AUDIT_LOGS=lsGet("auditLogs",null)||[]; if(cb)cb(); return; }
  fetch(CONFIG.GET_AUDIT_LOGS_FLOW_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ var a=d.value||d.logs||d||[]; if(!(a instanceof Array)) a=[]; AUDIT_LOGS=[]; for(var i=0;i<a.length;i++) AUDIT_LOGS.push(normalizeLog(a[i])); lsSet("auditLogs",AUDIT_LOGS); if(cb)cb(); })
    .catch(function(){ AUDIT_LOGS=lsGet("auditLogs",null)||[]; if(cb)cb(); });
}

function renderAudits(sub){
  if(sub) AUDIT.sub=sub;
  if(!AUDIT._loaded){ AUDIT._loaded=true; loadIssues(function(){ loadLogs(function(){ renderAudits(); }); }); }
  var h='<div class="tabs">'+tabsHTML()+'</div>';
  h+='<div class="row-between" style="margin-bottom:6px"><div><div class="section-title">Store audits</div><div class="section-sub">Field checklist for store visits. Flagged items become the HQ punch list.</div></div></div>';
  h+='<div class="audit-tabs">';
  var subs=[{id:"new",label:"+ New audit"},{id:"issues",label:"Open issues"},{id:"history",label:"History"}];
  for(var i=0;i<subs.length;i++) h+='<button class="'+(AUDIT.sub===subs[i].id?'on':'')+'" onclick="renderAudits(\''+subs[i].id+'\')">'+subs[i].label+'</button>';
  h+='</div>';
  if(AUDIT.sub==="new") h+=aNew();
  else if(AUDIT.sub==="issues") h+=aIssues();
  else if(AUDIT.sub==="history") h+=aHistory();
  $("wrap").innerHTML=h;
}

function aNew(){
  var so='<option value="">Pick a store…</option>';
  for(var i=0;i<CFG.stores.length;i++){ so+='<option value="'+X(CFG.stores[i].code)+'"'+(AUDIT.store===CFG.stores[i].code?' selected':'')+'>'+X(CFG.stores[i].code)+' — '+X(CFG.stores[i].name)+'</option>'; }
  var done=0,no=0;
  for(var k=0;k<AUDIT_QUESTIONS.length;k++){ for(var m=0;m<AUDIT_QUESTIONS[k].items.length;m++){ var qq=AUDIT_QUESTIONS[k].items[m]; if(qq.type==="text") continue; if(AUDIT.answers[qq.id]&&AUDIT.answers[qq.id].answer){ done++; if(AUDIT.answers[qq.id].answer==="no") no++; } } }
  var t=totalAnsweredQuestions();
  var h='<div class="card pad">';
  h+='<div class="grid2"><div class="field"><label>Auditor name</label><input value="'+X(AUDIT.auditor)+'" placeholder="e.g. Rose Perez" oninput="AUDIT.auditor=this.value"></div>';
  h+='<div class="field"><label>Store</label><select onchange="AUDIT.store=this.value">'+so+'</select></div></div>';
  h+='<div style="margin-bottom:14px"><span class="summary-pill" style="background:var(--gray-bg);color:var(--purple)">'+done+'/'+t+' answered</span>';
  if(no>0) h+='<span class="summary-pill b-open">'+no+' flagged</span>';
  h+='</div>';
  for(var s=0;s<AUDIT_QUESTIONS.length;s++){
    h+='<div class="audit-section-hd">'+X(AUDIT_QUESTIONS[s].section)+'</div>';
    for(var j=0;j<AUDIT_QUESTIONS[s].items.length;j++) h+=aQbox(AUDIT_QUESTIONS[s].items[j]);
  }
  h+='<div class="row-between" style="margin-top:18px;margin-bottom:0"><button class="btn btn-ghost" onclick="resetAudit()">Reset</button><button class="btn btn-primary" id="audit-submit" onclick="submitAudit()">Submit audit &#10003;</button></div>';
  h+='</div>';
  return h;
}
function aQbox(it){
  var a=AUDIT.answers[it.id]||{};
  if(it.type==="text"){
    return '<div class="qbox"><div class="qtxt">'+X(it.q)+'</div><textarea style="width:100%;font-family:Montserrat;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;min-height:50px;outline:none" oninput="setAuditAns(\''+it.id+'\',\'text\',this.value)" placeholder="List the key holders for this store…">'+X(a.note||"")+'</textarea></div>';
  }
  var cls=a.answer==="yes"?"yes":a.answer==="no"?"no":a.answer==="na"?"na":"";
  var h='<div class="qbox '+cls+'" id="qb-'+it.id+'"><div class="qtxt">'+X(it.q)+'</div>';
  h+='<div class="ynbtns">';
  h+='<button class="'+(a.answer==="yes"?"yes-on":"")+'" onclick="setAuditAns(\''+it.id+'\',\'yes\')">Yes</button>';
  h+='<button class="'+(a.answer==="no"?"no-on":"")+'" onclick="setAuditAns(\''+it.id+'\',\'no\')">No</button>';
  h+='<button class="'+(a.answer==="na"?"na-on":"")+'" onclick="setAuditAns(\''+it.id+'\',\'na\')">N/A</button>';
  h+='</div>';
  h+='<div class="qnote"><textarea placeholder="What\'s the issue? (required)" oninput="setAuditNote(\''+it.id+'\',this.value)">'+X(a.note||"")+'</textarea>';
  h+='<div class="qphoto"><label for="ph-'+it.id+'">&#128247; Add photo<input type="file" id="ph-'+it.id+'" accept="image/*" onchange="setAuditPhoto(\''+it.id+'\',this)"></label>';
  if(a.photo){ h+='<div class="preview" style="background-image:url('+a.photo+')"></div><span class="pname">photo attached</span><button class="iconbtn" onclick="setAuditPhoto(\''+it.id+'\',null)" style="margin-left:6px;width:28px;height:28px">&times;</button>'; }
  h+='</div></div></div>';
  return h;
}
function setAuditAns(qid,ans,textVal){
  if(!AUDIT.answers[qid]) AUDIT.answers[qid]={};
  if(ans==="text"){ AUDIT.answers[qid].note=textVal; return; }
  AUDIT.answers[qid].answer=ans;
  if(ans!=="no"){ AUDIT.answers[qid].note=""; AUDIT.answers[qid].photo=""; }
  renderAudits();
}
function setAuditNote(qid,v){ if(!AUDIT.answers[qid]) AUDIT.answers[qid]={}; AUDIT.answers[qid].note=v; }
function setAuditPhoto(qid,input){
  if(!AUDIT.answers[qid]) AUDIT.answers[qid]={};
  if(input===null){ AUDIT.answers[qid].photo=""; renderAudits(); return; }
  var f=input.files&&input.files[0]; if(!f) return;
  if(f.size>4*1024*1024){ alert("Photo too large (max 4 MB). Try a smaller image."); return; }
  var rd=new FileReader();
  rd.onload=function(e){ AUDIT.answers[qid].photo=e.target.result; renderAudits(); };
  rd.readAsDataURL(f);
}
function resetAudit(){ if(confirm("Clear this audit?")){ AUDIT={ sub:"new", store:"", auditor:AUDIT.auditor, answers:{}, busy:false, _loaded:true }; renderAudits(); } }

function newAuditId(){ var d=new Date(); return "AU-"+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+"-"+Math.floor(1000+Math.random()*9000); }
function submitAudit(){
  if(AUDIT.busy) return;
  if(!AUDIT.store){ alert("Pick a store."); return; }
  if(!AUDIT.auditor){ alert("Enter your name as the auditor."); return; }
  var unanswered=0;
  for(var i=0;i<AUDIT_QUESTIONS.length;i++){ for(var j=0;j<AUDIT_QUESTIONS[i].items.length;j++){ var it=AUDIT_QUESTIONS[i].items[j]; if(it.type==="text") continue; if(!AUDIT.answers[it.id]||!AUDIT.answers[it.id].answer) unanswered++; } }
  if(unanswered){ alert("Please answer all questions ("+unanswered+" remaining)."); return; }
  for(var k=0;k<AUDIT_QUESTIONS.length;k++){ for(var m=0;m<AUDIT_QUESTIONS[k].items.length;m++){ var qq=AUDIT_QUESTIONS[k].items[m]; var a=AUDIT.answers[qq.id]; if(a&&a.answer==="no"&&!a.note){ alert("Please add a note for: "+qq.q); return; } } }

  AUDIT.busy=true;
  var btn=$("audit-submit"); if(btn){ btn.disabled=true; btn.innerHTML="Sending…"; }

  var auditId=newAuditId(), total=0, flagged=0, flaggedItems=[], fullAnswers={};
  var keyholders=(AUDIT.answers["er2"]&&AUDIT.answers["er2"].note)||"";
  for(var s=0;s<AUDIT_QUESTIONS.length;s++){
    for(var t=0;t<AUDIT_QUESTIONS[s].items.length;t++){
      var qx=AUDIT_QUESTIONS[s].items[t], ans=AUDIT.answers[qx.id]||{};
      fullAnswers[qx.id]={ answer:ans.answer||"", note:ans.note||"" };
      if(qx.type==="text") continue;
      total++;
      if(ans.answer==="no"){
        flagged++;
        var rawPhoto = ans.photo||"";
        var b64 = rawPhoto && rawPhoto.indexOf(",")>=0 ? rawPhoto.substring(rawPhoto.indexOf(",")+1) : rawPhoto;
        flaggedItems.push({ issueId:"IS-"+auditId.substring(3)+"-"+flaggedItems.length, auditId:auditId, section:AUDIT_QUESTIONS[s].section, questionId:qx.id, question:qx.q, note:ans.note||"", photoBase64:b64, photoName:b64?(qx.id+".jpg"):"", status:"Open" });
      }
    }
  }
  var payload={ auditId:auditId, auditor:AUDIT.auditor, store:AUDIT.store, storeName:storeName(AUDIT.store), auditDate:todayISO(), totalCount:total, flaggedCount:flagged, keyholders:keyholders, answers:fullAnswers, flaggedItems:flaggedItems };

  function done(success){
    AUDIT.busy=false;
    if(success){
      alert("Audit submitted. "+flagged+" issue(s) opened.");
      AUDIT={ sub:"issues", store:"", auditor:AUDIT.auditor, answers:{}, busy:false, _loaded:false };
      renderAudits();
    } else {
      var pending=lsGet("pendingAudits",[]); pending.push(payload); lsSet("pendingAudits",pending);
      alert("Couldn't reach SharePoint — the audit was saved locally and will need to be re-sent.");
      var b=$("audit-submit"); if(b){ b.disabled=false; b.innerHTML="Submit audit &#10003;"; }
    }
  }
  if(configured(CONFIG.SAVE_AUDIT_FLOW_URL)){
    fetch(CONFIG.SAVE_AUDIT_FLOW_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
      .then(function(r){ if(!r.ok) throw 0; done(true); })
      .catch(function(){ done(false); });
  } else {
    var pending=lsGet("pendingAudits",[]); pending.push(payload); lsSet("pendingAudits",pending);
    alert("Audit saved locally (Save Audit flow not wired yet).");
    done(true);
  }
}

function updateIssue(issueId,status){
  var iss=null; for(var i=0;i<ISSUES.length;i++){ if(ISSUES[i].issueId===issueId){ iss=ISSUES[i]; break; } }
  if(!iss) return;
  iss.status=status;
  if(status==="Fixed"){ if(!iss.fixedDate) iss.fixedDate=todayISO(); if(!iss.fixedBy) iss.fixedBy="HQ Admin"; }
  if(status!=="Fixed"){ iss.fixedDate=""; iss.fixedBy=""; }
  lsSet("auditIssues",ISSUES);
  if(configured(CONFIG.UPDATE_AUDIT_ISSUE_FLOW_URL)){
    fetch(CONFIG.UPDATE_AUDIT_ISSUE_FLOW_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(iss)}).catch(function(){});
  }
  renderAudits();
}

function aIssues(){
  var so='<option value="">All stores</option>';
  for(var i=0;i<CFG.stores.length;i++){ so+='<option value="'+X(CFG.stores[i].code)+'"'+(ISSUE_FILTER.store===CFG.stores[i].code?' selected':'')+'>'+X(CFG.stores[i].code)+'</option>'; }
  var st='<option value="">All statuses</option>';
  for(var j=0;j<ISSUE_STATUSES.length;j++) st+='<option value="'+ISSUE_STATUSES[j]+'"'+(ISSUE_FILTER.status===ISSUE_STATUSES[j]?' selected':'')+'>'+ISSUE_STATUSES[j]+'</option>';
  var list=[];
  for(var k=0;k<ISSUES.length;k++){ var iss=ISSUES[k]; if(ISSUE_FILTER.store&&iss.store!==ISSUE_FILTER.store) continue; if(ISSUE_FILTER.status&&iss.status!==ISSUE_FILTER.status) continue; list.push(iss); }
  var rank={"Open":0,"In Progress":1,"Fixed":2};
  list.sort(function(a,b){ var ra=rank[a.status]==null?9:rank[a.status], rb=rank[b.status]==null?9:rank[b.status]; if(ra!==rb) return ra-rb; return a.auditDate<b.auditDate?1:-1; });
  var openN=0,progN=0,fixedN=0;
  for(var x=0;x<ISSUES.length;x++){ if(ISSUES[x].status==="Open") openN++; else if(ISSUES[x].status==="In Progress") progN++; else if(ISSUES[x].status==="Fixed") fixedN++; }
  var h='<div class="tiles"><div class="tile r"><div class="lbl">Open</div><div class="val">'+openN+'</div></div><div class="tile a"><div class="lbl">In Progress</div><div class="val">'+progN+'</div></div><div class="tile g"><div class="lbl">Fixed</div><div class="val">'+fixedN+'</div></div></div>';
  h+='<div class="filters"><select onchange="ISSUE_FILTER.store=this.value;renderAudits()">'+so+'</select><select onchange="ISSUE_FILTER.status=this.value;renderAudits()">'+st+'</select></div>';
  h+='<div class="card pad">';
  if(list.length===0) h+='<div class="empty">No issues match the current filters. Submit an audit with a No answer and they show up here.</div>';
  for(var y=0;y<list.length;y++) h+=aIssueCard(list[y]);
  h+='</div>';
  return h;
}
function aIssueCard(iss){
  var cls=iss.status==="Open"?"open":iss.status==="In Progress"?"prog":"fixed";
  var h='<div class="issue-card '+cls+'">';
  if(iss.photoUrl) h+='<div class="thumb" style="background-image:url('+X(iss.photoUrl)+')" onclick="window.open(\''+X(iss.photoUrl)+'\',\'_blank\')" title="Open photo"></div>';
  h+='<div class="body"><div class="top"><span class="store">'+X(iss.store)+'</span> <span class="muted" style="font-size:12px">'+X(iss.section)+'</span> '+issueBadge(iss.status)+'</div>';
  h+='<div class="q">'+X(iss.question)+'</div>';
  if(iss.note) h+='<div class="note">'+X(iss.note)+'</div>';
  h+='<div class="meta"><span>Reported by '+X(iss.auditor||"—")+'</span><span>'+fmtDate(iss.auditDate)+'</span>';
  if(iss.fixedDate) h+='<span>Fixed '+fmtDate(iss.fixedDate)+(iss.fixedBy?' by '+X(iss.fixedBy):'')+'</span>';
  h+='</div></div>';
  h+='<div class="acts">';
  if(iss.status!=="Open") h+='<button class="btn btn-ghost btn-sm" onclick="updateIssue(\''+X(iss.issueId)+'\',\'Open\')">Reopen</button>';
  if(iss.status!=="In Progress") h+='<button class="btn btn-ghost btn-sm" onclick="updateIssue(\''+X(iss.issueId)+'\',\'In Progress\')">In progress</button>';
  if(iss.status!=="Fixed") h+='<button class="btn btn-primary btn-sm" onclick="updateIssue(\''+X(iss.issueId)+'\',\'Fixed\')">Mark fixed</button>';
  h+='</div></div>';
  return h;
}

function aHistory(){
  var byStore={};
  for(var i=0;i<AUDIT_LOGS.length;i++){ var l=AUDIT_LOGS[i]; if(!byStore[l.store]) byStore[l.store]=[]; byStore[l.store].push(l); }
  var storeKeys=[]; for(var s in byStore) storeKeys.push(s);
  storeKeys.sort(function(a,b){ var la="",lb=""; for(var i=0;i<byStore[a].length;i++) if(byStore[a][i].auditDate>la) la=byStore[a][i].auditDate; for(var j=0;j<byStore[b].length;j++) if(byStore[b][j].auditDate>lb) lb=byStore[b][j].auditDate; return la<lb?1:-1; });
  var h='';
  if(storeKeys.length===0) h+='<div class="card pad"><div class="empty">No audits submitted yet. Submit one from the "+ New audit" tab.</div></div>';
  for(var k=0;k<storeKeys.length;k++){
    var code=storeKeys[k], logs=byStore[code].slice(); logs.sort(function(a,b){ return a.auditDate<b.auditDate?1:-1; });
    h+='<div class="card" style="margin-bottom:14px"><div class="pad" style="padding-bottom:10px"><div class="row-between" style="margin-bottom:0"><div><strong>'+X(code)+'</strong> <span class="muted">— '+X(storeName(code))+'</span></div><span class="chip">'+logs.length+' audit(s)</span></div></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Auditor</th><th>Score</th><th>Flagged</th><th>Key holders</th></tr></thead><tbody>';
    for(var t=0;t<logs.length;t++){
      var lg=logs[t], score=lg.totalCount?((lg.totalCount-lg.flaggedCount)+"/"+lg.totalCount):"—";
      h+='<tr><td class="muted">'+fmtDate(lg.auditDate)+'</td><td>'+X(lg.auditor)+'</td><td>'+score+'</td><td>'+(lg.flaggedCount>0?'<span class="badge b-open">'+lg.flaggedCount+'</span>':'<span class="badge b-fulfilled">0</span>')+'</td><td class="muted" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+X(lg.keyholders||"—")+'</td></tr>';
    }
    h+='</tbody></table></div></div>';
  }
  return h;
}
/* ============================================================
   AUDIT MODULE — PIN-gated inside the dashboard
   ============================================================ */
</script>
</body>
