<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edgelink — Supply Order Form</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap');
:root{
  --magenta:#E20074;--magenta-dk:#b3005b;--magenta-lt:#fce8f3;
  --purple:#5C2D91;--purple-dk:#3e1d6e;--purple-lt:#ede7f6;
  --ink:#241229;--muted:#6b6470;--line:#ece7f1;--bg:#f6f3fa;--card:#fff;--surface:#faf8fc;
  --green:#1f9d5b;--green-bg:#e7f6ed;--amber:#c77d12;--amber-bg:#fcf2df;
  --r:14px;--r-sm:10px;--shadow:0 1px 2px rgba(36,18,41,.05),0 4px 16px rgba(74,27,92,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Montserrat',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:50px}
h1,h2,h3{font-weight:600;line-height:1.2}
.topbar{background:linear-gradient(95deg,var(--purple),var(--magenta));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(74,27,92,.18)}
.diamond{width:30px;height:30px;transform:rotate(45deg);border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center}
.diamond span{transform:rotate(-45deg);font-family:'Bebas Neue';font-size:20px;color:var(--magenta)}
.brand .name{font-family:'Bebas Neue';font-size:26px;letter-spacing:1px;line-height:1}
.brand .sub{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;opacity:.85;margin-top:-2px}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.section-title{font-family:'Bebas Neue';font-size:24px;letter-spacing:.6px;color:var(--purple);margin-bottom:3px}
.section-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:13px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--magenta)}
.tile.p:before{background:var(--purple)}.tile.a:before{background:var(--amber)}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
.tile .val{font-family:'Bebas Neue';font-size:38px;line-height:1;margin-top:7px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font-family:'Montserrat';font-size:14px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--magenta);box-shadow:0 0 0 3px rgba(226,0,116,.12)}
.field textarea{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.stepper{display:flex;align-items:center;overflow-x:auto;padding:4px 2px 14px}
.step{display:flex;align-items:center;flex-shrink:0}
.step .num{width:30px;height:30px;border-radius:50%;background:#f0edf4;color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.step .txt{font-size:12px;color:var(--muted);margin:0 12px 0 9px;white-space:nowrap;font-weight:500}
.step .bar{width:24px;height:2px;background:var(--line)}
.step.done .num{background:var(--green);color:#fff}
.step.active .num{background:linear-gradient(135deg,var(--purple),var(--magenta));color:#fff}
.step.active .txt{color:var(--purple);font-weight:600}
.stepbody{min-height:240px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:9px;background:#fff}
.item.has{border-color:var(--magenta);box-shadow:0 0 0 2px rgba(226,0,116,.08)}
.item .nm{font-size:13.5px;font-weight:600}
.item .meta{font-size:11px;color:var(--muted)}
.item .warn{font-size:10.5px;color:var(--amber);font-weight:600}
.qty{display:flex;align-items:center;margin-top:auto;border:1px solid var(--line);border-radius:9px;overflow:hidden;width:fit-content}
.qty button{width:34px;height:34px;border:0;background:var(--surface);color:var(--purple);font-size:18px;cursor:pointer;font-weight:600}
.qty button:hover{background:#f0edf4}
.qty input{width:46px;height:34px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-family:'Montserrat';font-size:14px;font-weight:600;outline:none}
.btn{font-family:'Montserrat';font-weight:600;font-size:13px;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn-primary{background:linear-gradient(95deg,var(--purple),var(--magenta));color:#fff}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:#fff;color:var(--purple);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--surface)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.announce{background:linear-gradient(95deg,rgba(226,0,116,.08),rgba(92,45,145,.08));border:1px solid rgba(226,0,116,.2);border-radius:var(--r);padding:13px 16px;display:flex;gap:11px;align-items:flex-start;margin-bottom:14px}
.announce .ic{color:var(--magenta);font-size:18px;flex-shrink:0;margin-top:1px}
.announce .t{font-size:13px;font-weight:600}.announce .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line)}
table.tbl tr:last-child td{border-bottom:0}
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
.banner-warn{background:var(--amber-bg);color:var(--amber);font-size:12px;padding:8px 16px;text-align:center;font-weight:600}
</style>
</head>
<body>
<div class="topbar">
  <div class="diamond"><span>E</span></div>
  <div class="brand"><div class="name">EDGELINK</div><div class="sub">Supply Order Form</div></div>
</div>
<div id="offline" class="banner-warn" style="display:none">Showing saved list — couldn't reach the live config. Your order will still send.</div>
<div class="wrap" id="wrap"><div class="loading">Loading supply list…</div></div>

<script>
/* ============================================================
   EDGELINK SUPPLY ORDER FORM
   ES5 only. Reads data.json for the editable supply list.
   Submits via EmailJS + Power Automate (same pipeline as /orders).
   ============================================================ */

/* ---------- CONFIG: paste your values here ----------
   These mirror your accessory /orders setup. Create NEW supply
   versions of each (so supplies don't mix with accessories).      */
var CONFIG = {
  DATA_URL: "data.json",                 /* same folder on GitHub Pages */
  EMAILJS_PUBLIC_KEY: "YOUR_EMAILJS_PUBLIC_KEY",
  EMAILJS_SERVICE_ID: "YOUR_EMAILJS_SERVICE_ID",
  EMAILJS_TEMPLATE_ID: "YOUR_SUPPLY_TEMPLATE_ID",
  SAVE_FLOW_URL: "PASTE_SAVE_SUPPLY_ORDER_FLOW_URL"   /* Power Automate "Save Edgelink Supply Order" HTTP trigger URL */
};
/* ---------------------------------------------------- */

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function X(s){ if(s==null) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function pad2(n){ return n<10?"0"+n:""+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function fmtDate(s){ if(!s) return "—"; var p=s.split("-"); return p[1]+"/"+p[2]+"/"+p[0]; }

/* ---------- config (loaded) ---------- */
var CATS=[], ITEMS=[], STORES=[], ANN=[];
var FORM={ step:1, employee:"", store:"", date:todayISO(), qty:{}, notes:"", orderNum:"", sending:false };
var STEPS=[]; /* built from categories */

/* ---------- load ---------- */
function boot(){
  fetch(CONFIG.DATA_URL,{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("bad"); return r.json(); })
    .then(function(j){ applyConfig(j); lsSet("supplyConfig",j); render(); })
    .catch(function(){
      var c=lsGet("supplyConfig",null);
      if(c){ applyConfig(c); $("offline").style.display="block"; render(); }
      else { $("wrap").innerHTML='<div class="loading">Couldn\'t load the supply list. Check your connection and refresh.</div>'; }
    });
}
function applyConfig(j){
  CATS=j.categories||[]; ITEMS=j.items||[]; STORES=j.stores||[]; ANN=j.announcements||[];
  CATS.sort(function(a,b){ return (a.step||99)-(b.step||99); });
  STEPS=[{n:1,label:"Store Info",cat:null}];
  for(var i=0;i<CATS.length;i++){ STEPS.push({n:i+2,label:shortLabel(CATS[i].name),cat:CATS[i].id}); }
  STEPS.push({n:CATS.length+2,label:"Review",cat:null});
}
function shortLabel(n){ return n.replace(" Supplies","").replace(" / Signage",""); }
function catName(id){ for(var i=0;i<CATS.length;i++){ if(CATS[i].id===id) return CATS[i].name; } return id; }
function itemById(id){ for(var i=0;i<ITEMS.length;i++){ if(ITEMS[i].id===id) return ITEMS[i]; } return null; }
function storeName(c){ for(var i=0;i<STORES.length;i++){ if(STORES[i].code===c) return STORES[i].name; } return c; }
var LAST_STEP=function(){ return STEPS.length; };

/* ---------- render ---------- */
function render(){
  if(FORM.orderNum){ $("wrap").innerHTML=confirmScreen(); return; }
  var h="";
  var a=null; for(var i=0;i<ANN.length;i++){ if(ANN[i].active){ a=ANN[i]; break; } }
  if(a) h+='<div class="announce"><div class="ic">&#9888;</div><div><div class="t">'+X(a.title)+'</div><div class="d">'+X(a.body)+'</div></div></div>';

  h+='<div class="card pad" style="margin-bottom:16px"><div class="stepper">';
  for(var s=0;s<STEPS.length;s++){
    var st=STEPS[s]; var cls=st.n<FORM.step?"done":(st.n===FORM.step?"active":"");
    h+='<div class="step '+cls+'"><div class="num">'+(st.n<FORM.step?"&#10003;":st.n)+'</div><div class="txt">'+X(st.label)+'</div>'+(s<STEPS.length-1?'<div class="bar"></div>':'')+'</div>';
  }
  h+='</div><div class="stepbody">'+stepBody()+'</div>';
  h+='<div class="row-between" style="margin-top:18px">';
  h+='<button class="btn btn-ghost" onclick="prev()" '+(FORM.step===1?'disabled':'')+'>&#8592; Back</button>';
  if(FORM.step<LAST_STEP()){ h+='<button class="btn btn-primary" onclick="next()">Next &#8594;</button>'; }
  else { h+='<div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="window.print()">&#128424; Print</button><button class="btn btn-primary" id="submitBtn" onclick="submitOrder()">'+(FORM.sending?'Sending…':'Submit order &#10003;')+'</button></div>'; }
  h+='</div></div>';
  $("wrap").innerHTML=h;
  if(FORM.step===1){ var st=$("f-store"); if(st) st.value=FORM.store; }
}
function curCat(){ for(var i=0;i<STEPS.length;i++){ if(STEPS[i].n===FORM.step) return STEPS[i].cat; } return null; }

function stepBody(){
  if(FORM.step===1){
    var opts='<option value="">Select your store…</option>';
    for(var i=0;i<STORES.length;i++){ opts+='<option value="'+X(STORES[i].code)+'">'+X(STORES[i].code)+' — '+X(STORES[i].name)+'</option>'; }
    return '<div class="section-title">Store information</div><div class="section-sub">Tell us who you are and where this is going.</div>'+
      '<div class="grid2"><div class="field"><label>Employee name</label><input id="f-emp" value="'+X(FORM.employee)+'" placeholder="e.g. Maria Santos" oninput="FORM.employee=this.value"></div>'+
      '<div class="field"><label>Order date</label><input id="f-date" type="date" value="'+FORM.date+'" oninput="FORM.date=this.value"></div></div>'+
      '<div class="field"><label>Store location</label><select id="f-store" onchange="FORM.store=this.value">'+opts+'</select></div>';
  }
  var cat=curCat();
  if(cat){ return '<div class="section-title">'+X(catName(cat))+'</div><div class="section-sub">Set a quantity for anything you need. Leave at 0 to skip.</div>'+itemCards(cat); }
  return reviewBody();
}
function itemCards(cat){
  var h='<div class="items">',any=false;
  for(var i=0;i<ITEMS.length;i++){
    var it=ITEMS[i]; if(it.cat!==cat||!it.active) continue; any=true;
    var q=FORM.qty[it.id]||0;
    h+='<div class="item'+(q>0?' has':'')+'" id="card-'+it.id+'"><div class="nm">'+X(it.name)+'</div><div class="meta">per '+X(it.unit)+'</div>';
    if(it.reorder) h+='<div class="warn">&#9888; '+X(it.reorder)+'</div>';
    h+='<div class="qty"><button onclick="bump(\''+it.id+'\',-1)">&minus;</button><input value="'+q+'" id="q-'+it.id+'" onchange="setQty(\''+it.id+'\',this.value)"><button onclick="bump(\''+it.id+'\',1)">+</button></div></div>';
  }
  h+='</div>';
  if(!any) h+='<div class="muted" style="padding:20px 0">No active items in this category right now.</div>';
  return h;
}
function bump(id,d){ var q=(FORM.qty[id]||0)+d; if(q<0)q=0; FORM.qty[id]=q; $("q-"+id).value=q; $("card-"+id).className="item"+(q>0?" has":""); }
function setQty(id,v){ var q=parseInt(v,10); if(isNaN(q)||q<0)q=0; FORM.qty[id]=q; $("q-"+id).value=q; $("card-"+id).className="item"+(q>0?" has":""); }

function selectedLines(){ var l=[]; for(var id in FORM.qty){ if(FORM.qty[id]>0){ var it=itemById(id); if(it) l.push({it:it,qty:FORM.qty[id]}); } } return l; }
function reviewBody(){
  var lines=selectedLines(),cats={},units=0;
  for(var i=0;i<lines.length;i++){ cats[lines[i].it.cat]=true; units+=lines[i].qty; }
  var h='<div class="section-title">Review &amp; submit</div><div class="section-sub">Check everything looks right before sending to HQ.</div>';
  h+='<div class="tiles" style="margin-bottom:16px"><div class="tile"><div class="lbl">Line items</div><div class="val">'+lines.length+'</div></div><div class="tile p"><div class="lbl">Total units</div><div class="val">'+units+'</div></div><div class="tile a"><div class="lbl">Categories</div><div class="val">'+Object.keys(cats).length+'</div></div></div>';
  h+='<div class="card"><div class="pad" style="padding-bottom:8px"><strong style="font-size:13px">'+X(FORM.employee||"—")+'</strong> &middot; <span class="muted">'+X(storeName(FORM.store))+'</span> &middot; <span class="muted">'+fmtDate(FORM.date)+'</span></div>';
  if(lines.length===0){ h+='<div class="muted" style="padding:24px;text-align:center">No items added yet. Go back and set some quantities.</div>'; }
  else{
    h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Category</th><th style="text-align:right">Qty</th></tr></thead><tbody>';
    for(var j=0;j<lines.length;j++){ h+='<tr><td>'+X(lines[j].it.name)+'</td><td class="muted">'+X(catName(lines[j].it.cat))+'</td><td style="text-align:right;font-weight:600">'+lines[j].qty+'</td></tr>'; }
    h+='</tbody></table></div>';
  }
  h+='</div><div class="field" style="margin-top:16px"><label>Notes / special requests</label><textarea oninput="FORM.notes=this.value" placeholder="Anything HQ should know…">'+X(FORM.notes)+'</textarea></div>';
  return h;
}
function next(){
  if(FORM.step===1 && (!FORM.employee||!FORM.store)){ alert("Please enter your name and select a store."); return; }
  if(FORM.step<LAST_STEP()){ FORM.step++; render(); window.scrollTo(0,0); }
}
function prev(){ if(FORM.step>1){ FORM.step--; render(); window.scrollTo(0,0); } }

/* ---------- submit ---------- */
function buildOrder(){
  var lines=selectedLines(),cats={},units=0,itemsText="",itemsArr=[];
  for(var i=0;i<lines.length;i++){
    cats[lines[i].it.cat]=true; units+=lines[i].qty;
    itemsArr.push({id:lines[i].it.id,name:lines[i].it.name,cat:lines[i].it.cat,unit:lines[i].it.unit,qty:lines[i].qty});
    itemsText+="• "+lines[i].qty+" x "+lines[i].it.name+" ("+catName(lines[i].it.cat)+")\n";
  }
  var d=new Date(), num="SO-"+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+"-"+Math.floor(1000+Math.random()*9000);
  return {
    orderId:num, employee:FORM.employee, store:FORM.store, storeName:storeName(FORM.store),
    orderDate:FORM.date, items:itemsArr, itemsText:itemsText, lineCount:lines.length, unitCount:units,
    categoryCount:Object.keys(cats).length, notes:FORM.notes, status:"Pending",
    po:"", tracking:"", fulfillmentNotes:"", dateFulfilled:"", updatedBy:""
  };
}
function submitOrder(){
  if(FORM.sending) return;
  if(selectedLines().length===0){ alert("Add at least one item before submitting."); return; }
  FORM.sending=true; var btn=$("submitBtn"); if(btn){ btn.disabled=true; btn.innerHTML="Sending…"; }
  var order=buildOrder();

  var emailParams={
    order_id:order.orderId, employee:order.employee, store:order.store+" — "+order.storeName,
    order_date:fmtDate(order.orderDate), items_text:order.itemsText, line_count:order.lineCount,
    unit_count:order.unitCount, notes:order.notes||"(none)", to_email:"hr@edgelinkinc.com"
  };

  var jobs=[];
  if(CONFIG.SAVE_FLOW_URL && CONFIG.SAVE_FLOW_URL.indexOf("PASTE_")<0){
    jobs.push(fetch(CONFIG.SAVE_FLOW_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(order)}));
  }
  if(typeof emailjs!=="undefined" && CONFIG.EMAILJS_PUBLIC_KEY.indexOf("YOUR_")<0){
    try{ emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY); jobs.push(emailjs.send(CONFIG.EMAILJS_SERVICE_ID,CONFIG.EMAILJS_TEMPLATE_ID,emailParams)); }catch(e){}
  }

  function done(){ FORM.orderNum=order.orderId; FORM.sending=false; lsSet("lastSupplyOrder",order); render(); window.scrollTo(0,0); }
  if(jobs.length===0){
    /* not configured yet — still show confirmation so the UI is testable */
    setTimeout(done,400);
  } else {
    Promise.all(jobs).then(done).catch(function(){
      alert("There was a problem sending. Your order number is saved below — please tell HQ if it doesn't arrive.");
      done();
    });
  }
}
function confirmScreen(){
  var o=lsGet("lastSupplyOrder",{}) || {};
  var h='<div class="card pad" style="text-align:center;max-width:560px;margin:30px auto">';
  h+='<div style="width:70px;height:70px;border-radius:50%;background:var(--green-bg);color:var(--green);font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px">&#10003;</div>';
  h+='<div class="section-title" style="font-size:30px">Order submitted</div><div class="section-sub">HQ has received your supply request.</div>';
  h+='<div style="font-family:\'Bebas Neue\';font-size:40px;color:var(--magenta);letter-spacing:1px">'+X(FORM.orderNum)+'</div>';
  h+='<div class="tiles" style="margin:18px 0"><div class="tile"><div class="lbl">Line items</div><div class="val">'+(o.lineCount||0)+'</div></div><div class="tile p"><div class="lbl">Total units</div><div class="val">'+(o.unitCount||0)+'</div></div><div class="tile a"><div class="lbl">Categories</div><div class="val">'+(o.categoryCount||0)+'</div></div></div>';
  h+='<div class="muted" style="font-size:12.5px">'+X(o.employee||"")+' &middot; '+X(o.storeName||"")+' &middot; '+fmtDate(o.orderDate||"")+'</div>';
  h+='<div style="display:flex;gap:8px;justify-content:center;margin-top:18px"><button class="btn btn-ghost" onclick="window.print()">&#128424; Print confirmation</button><button class="btn btn-primary" onclick="resetForm()">New order</button></div></div>';
  return h;
}
function resetForm(){ FORM={step:1,employee:"",store:"",date:todayISO(),qty:{},notes:"",orderNum:"",sending:false}; render(); window.scrollTo(0,0); }

boot();
</script>
</body>
</html>
